[project]
name = "fileuploader-fastapi"
version = "0.1.0"
description = "A FastAPI service for uploading and validating files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.22",
    "uvicorn>=0.41.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
